
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback | ShopEase</title>

    <link rel="stylesheet" href="Css/feedback.css">
    <script src="Js/feedback.js" defer></script>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">Shop<span>Ease</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="container">

        <section class="feedback-card">
            <h1>Customer Feedback</h1>
            <p>Tell us about your ShopEase experience.</p>

            <form id="feedbackForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    maxlength="255"
                    placeholder="Enter your email"
                    required
                >

                <label for="feedback">Your Feedback</label>
                <textarea
                    id="feedback"
                    rows="5"
                    maxlength="2000"
                    placeholder="Write your feedback here"
                    required
                ></textarea>

                <button type="submit" id="submitFeedbackBtn">
                    Submit Feedback
                </button>

                <p id="message" role="status"></p>
            </form>

            <a href="index.html" class="back-link">Back to Home</a>
        </section>

        <section class="feedback-list-section">
            <h2>New Feedback</h2>
            <p>Feedback shared by ShopEase visitors</p>

            <div id="feedbackList">
                <p>Loading feedback...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 ShopEase. All rights reserved.</p>
    </footer>

</body>
</html>
